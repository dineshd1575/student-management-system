<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <h1>🎓 Student Management System version 1</h1>
  </header>

  <main class="container">

    <!-- Form Section -->
    <section class="card">
      <h2 id="form-title">Add New Student Record</h2>
      <form id="studentForm">
        <input type="hidden" id="studentId" />

        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="e.g. Arun Kumar" />
          </div>

          <div class="form-group">
            <label for="roll_no">Roll No</label>
            <input type="text" id="roll_no" required placeholder="e.g. CS2023001" />
          </div>

          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" required placeholder="e.g. Computer Science" />
          </div>

          <div class="form-group">
            <label for="year">Year</label>
            <select id="year" required>
              <option value="">Select Year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="student@email.com" />
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="10-digit number" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn primary">Add Student</button>
          <button type="button" id="cancelBtn" class="btn secondary" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- List Section -->
    <section class="card">
      <div class="list-header">
        <h2>Students List</h2>
        <input type="text" id="searchInput" placeholder="🔍 Search by name or roll no..." />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Roll No</th>
              <th>Department</th>
              <th>Year</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
        <p id="emptyMsg" class="empty-msg" style="display:none;">No students found. Add one above 👆</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Student Management System &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
