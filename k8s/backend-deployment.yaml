apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: dineshd1575/student-backend:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

        imagePullPolicy: Always
